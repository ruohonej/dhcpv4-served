name: Packages and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.13.3
          args: release --snapshot --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-snapshot
          path: |
            dist/*.deb
            dist/checksums.txt
          if-no-files-found: error

  security:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/security.yml

  tests:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  fuzz:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/fuzz.yml

  release:
    needs: [security, tests, fuzz]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Pin the trusted builder independently of the source tag.
    uses: ruohonej/dhcpv4-served/.github/workflows/release-build.yml@5d8d58a6092a02d15834dcd2218555d700d384db
