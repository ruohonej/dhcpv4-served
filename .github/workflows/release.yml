name: Packages and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.13.3
          args: release --snapshot --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-snapshot
          path: |
            dist/*.deb
            dist/checksums.txt
          if-no-files-found: error

  release-policy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check protected release tag and reviewed main history
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          python3 scripts/check_release_policy.py

  security:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/security.yml

  tests:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  fuzz:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/fuzz.yml

  release:
    needs: [release-policy, security, tests, fuzz]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.13.3
          args: release --clean --skip=publish
      - name: Stage release assets
        run: scripts/stage-release-assets.sh
      - name: Generate amd64 binary SBOM
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          file: release-assets/dhcpv4-served-linux-amd64
          format: cyclonedx-json
          output-file: release-assets/dhcpv4-served-linux-amd64.cdx.json
          syft-version: v1.38.2
          upload-artifact: false
          upload-release-assets: false
      - name: Validate and bind binary SBOMs
        run: python3 scripts/validate_release_sboms.py
      - name: Create release manifest
        run: python3 scripts/create_release_manifest.py
      - name: Install pinned GitHub CLI
        run: |
          archive="$RUNNER_TEMP/gh_2.103.3_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz
          printf '%s  %s\n' 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.103.3_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.2
      - name: Sign and verify release assets
        run: scripts/sign_release_assets.sh
      - name: Test release verification failures
        run: scripts/test_release_verification.sh
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-verification-evidence
          path: work/release-verification/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_release.sh
