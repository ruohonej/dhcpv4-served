name: Build, attest, and publish release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-policy:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pinned builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Check public visibility, protected release tag and reviewed main history
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          python3 release-tools/scripts/check_release_policy.py

  build:
    needs: release-policy
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.13.3
          args: release --clean --skip=publish
      - name: Stage release assets
        run: scripts/stage-release-assets.sh
      - name: Generate amd64 binary SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          file: release-assets/dhcpv4-served-linux-amd64
          format: cyclonedx-json
          output-file: release-assets/dhcpv4-served-linux-amd64.cdx.json
          syft-version: v1.38.2
          upload-artifact: false
          upload-release-assets: false
      - name: Generate srvctl binary SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          file: release-assets/dhcpv4-srvctl-linux-amd64
          format: cyclonedx-json
          output-file: release-assets/dhcpv4-srvctl-linux-amd64.cdx.json
          syft-version: v1.38.2
          upload-artifact: false
          upload-release-assets: false
      - name: Validate and bind binary SBOMs
        run: python3 scripts/validate_release_sboms.py
      - name: Upload release files for attestation
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  attest-and-publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the pinned builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Require one build artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Download the build artifact as a ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: incoming/
          skip-decompress: true
          digest-mismatch: error
      - name: Copy the expected release files
        run: python3 release-tools/scripts/unpack_release_assets.py incoming release-assets
      - name: Create release manifest
        run: python3 release-tools/scripts/create_release_manifest.py
      - name: Install pinned GitHub CLI
        run: |
          archive="$RUNNER_TEMP/gh_2.103.3_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz
          printf '%s  %s\n' 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_2.103.3_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.2
      - name: Attest release assets
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*
      - name: Stage provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release-assets/provenance.sigstore.jsonl
      - name: Sign and verify release assets
        env:
          PROVENANCE_SIGNER_SHA: ${{ job.workflow_sha }}
        run: release-tools/scripts/sign_release_assets.sh
      - name: Test release verification failures
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_SIGNER_SHA: ${{ job.workflow_sha }}
        run: release-tools/scripts/test_release_verification.sh
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-verification-evidence
          path: work/release-verification/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: release-tools/scripts/publish_release.sh
