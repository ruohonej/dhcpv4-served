name: Bounded fuzzing

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/protocol
            target: FuzzParse
          - package: ./internal/server
            target: FuzzHandler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Run seeds and bounded fuzzing
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
        run: |
          duration=30s
          if [ "$EVENT" = schedule ]; then duration=5m; fi
          go test "$PACKAGE" -run '^$' -fuzz "^${TARGET}$" -fuzztime "$duration" -parallel 2
      - name: Retain reproductions
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
