version: 2

project_name: dhcpv4-served

builds:
  - id: dhcpv4-served
    main: ./cmd/dhcpv4-served
    binary: dhcpv4-served
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w -X main.buildSHA={{ .FullCommit }} -X main.version=v{{ .Version }}{{ if .IsSnapshot }}-{{ .ShortCommit }}{{ end }}

  - id: dhcpv4-srvctl
    main: ./cmd/dhcpv4-srvctl
    binary: dhcpv4-srvctl
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]

snapshot:
  version_template: "{{ .Version }}"

nfpms:
  - id: packages
    package_name: dhcpv4-served
    ids: [dhcpv4-served]
    vendor: dhcpv4-served contributors
    homepage: https://github.com/ruohonej/dhcpv4-served
    maintainer: ruohonej <18260595+ruohonej@users.noreply.github.com>
    description: Experimental unprivileged DHCPv4 server
    license: MIT
    formats: [deb]
    bindir: /usr/libexec
    contents:
      - src: dist/dhcpv4-srvctl_linux_amd64_v1/dhcpv4-srvctl
        dst: /usr/bin/dhcpv4-srvctl
        file_info:
          mode: 0755
      - src: deploy/systemd/dhcpv4-served@.service
        dst: /usr/lib/systemd/system/dhcpv4-served@.service
        file_info:
          mode: 0644
      - src: deploy/systemd/dhcpv4-served@.socket
        dst: /usr/lib/systemd/system/dhcpv4-served@.socket
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/dhcpv4-served/LICENSE
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/dhcpv4-served/NOTICE
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt
