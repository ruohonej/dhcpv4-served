# Pinned to mkosi 25.3 in CI; nspawn uses the runner's kernel.
[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=universe

[Output]
Format=directory
Output=dhcp-test
OutputDirectory=work/images

[Content]
Bootable=no
Packages=systemd
         systemd-resolved
         systemd-sysv
         libnss-systemd
         dbus
         bash
         ca-certificates
         iproute2
         procps
         util-linux
         python3
         libseccomp2
         isc-dhcp-client
         dhcpcd-base
ExtraTrees=work/image-root

[Build]
Incremental=yes
CacheDirectory=work/mkosi-cache
PackageCacheDirectory=work/mkosi-packages
